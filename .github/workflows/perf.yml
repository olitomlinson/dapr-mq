name: Performance (pr)

# The `pr` scale of sdks/testing/PERFORMANCE_TESTS.md: every SDK runs its pr profiles against its own
# Testcontainers stack (1 API replica, 3-node scheduler HA), compared with the median of recent
# `main` runs (table in each job's summary). Report-only: a job fails on lost/reordered messages or
# failed operations, not on a slower number. Add --gate once each metric's noise is known.
#
# Results accumulate on the orphan `perf-results` branch (sdk-<sdk>/ per SDK, report.html at the
# root). SDK jobs only read it (baselines); the publish job merges their new runs in by runId,
# regenerates the cross-SDK report and pushes - on main, nightly and manual runs. Every run, PRs
# included, uploads the report as the perf-report artifact.
#
# The extreme scale is manual only: perf-extreme.yml.

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'sdks/**'
      - '.github/workflows/perf.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'sdks/**'
      - '.github/workflows/perf.yml'
  schedule:
    - cron: '0 4 * * *' # nightly, so main keeps a baseline even on quiet days
  workflow_dispatch:
    inputs:
      dotnet_args:
        description: '.NET harness flags, e.g. --suite pr | --profile enqueue | --profile steady-drain --idle-timeout 1'
        required: false
        default: '--suite pr'
      sdk_args:
        description: 'Python, TypeScript and Java harness flags, e.g. --suite pr | --profile enqueue'
        required: false
        default: '--suite pr'

permissions:
  contents: write

concurrency:
  # PR runs replace each other; runs that write results queue so pushes to perf-results never race.
  group: ${{ github.event_name == 'pull_request' && format('perf-{0}', github.ref) || 'perf-results' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which SDKs to run, from the changed paths (same rules as sdk-integration-tests.yml):
  #   server/** or sdks/testing/** or this file -> every SDK; sdks/<sdk>/** -> that SDK.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.decide.outputs.dotnet }}
      python: ${{ steps.decide.outputs.python }}
      typescript: ${{ steps.decide.outputs.typescript }}
      java: ${{ steps.decide.outputs.java }}
      any: ${{ steps.decide.outputs.any }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: |
            all:
              - 'server/**'
              - 'sdks/testing/**'
              - '.github/workflows/perf.yml'
            dotnet:
              - 'sdks/dotnet/**'
            python:
              - 'sdks/python/**'
            typescript:
              - 'sdks/typescript/**'
            java:
              - 'sdks/java/**'

      - name: Decide
        id: decide
        run: |
          all=${{ steps.filter.outputs.all }}
          [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "schedule" ]] && all=true
          dotnet=$all; python=$all; typescript=$all; java=$all
          [[ "${{ steps.filter.outputs.dotnet }}" == "true" ]] && dotnet=true
          [[ "${{ steps.filter.outputs.python }}" == "true" ]] && python=true
          [[ "${{ steps.filter.outputs.typescript }}" == "true" ]] && typescript=true
          [[ "${{ steps.filter.outputs.java }}" == "true" ]] && java=true
          any=false
          [[ $dotnet == true || $python == true || $typescript == true || $java == true ]] && any=true
          {
            echo "dotnet=$dotnet"
            echo "python=$python"
            echo "typescript=$typescript"
            echo "java=$java"
            echo "any=$any"
          } | tee -a "$GITHUB_OUTPUT"

  # Harness and report-tool unit tests: quick, and catch a broken harness before the stack starts.
  unit:
    name: Perf tooling unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test sdks/testing/perf/DaprMQ.PerfReport.Tests
      - run: dotnet test sdks/dotnet/tests/DaprMQ.Client.Perf.Tests

  build-image:
    name: Build daprmq-api image
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          tags: daprmq-api:test
          outputs: type=docker,dest=daprmq-api.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v4
        with:
          name: daprmq-api-image
          path: daprmq-api.tar
          retention-days: 1

  dotnet:
    name: .NET SDK
    needs: [changes, unit, build-image]
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: ./sdks/testing/actions/load-api-image

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: ./sdks/testing/actions/checkout-perf-results

      - name: Run pr profiles
        env:
          ARGS: ${{ inputs.dotnet_args || '--suite pr' }}
        # ARGS is deliberately unquoted so it splits into separate flags. The comparison table is
        # appended to the job summary by the harness itself (GITHUB_STEP_SUMMARY).
        run: >
          dotnet run -c Release --project sdks/dotnet/perf/DaprMQ.Client.Perf --
          --env-label ci-ubuntu-latest
          --out perf-results
          $ARGS

      # Actor state reads/writes per operation, from Postgres' statement log. Runs even if the
      # profiles failed, since the two measure unrelated things.
      - name: Run state reads benchmark
        if: ${{ !cancelled() }}
        run: >
          dotnet run -c Release --project sdks/dotnet/perf/DaprMQ.Client.Perf --
          --benchmark state-reads
          --env-label ci-ubuntu-latest
          --out perf-results

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: perf-sdk-dotnet
          path: perf-results/sdk-dotnet
          if-no-files-found: ignore

  # The other SDKs' harnesses: each runs its own unit tests first (a broken harness fails before the
  # stack starts), then its pr profiles on its own Testcontainers stack. .NET is still needed for the
  # report tool's `check`, which the harness calls at the end.
  python:
    name: Python SDK
    needs: [changes, unit, build-image]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: ./sdks/testing/actions/load-api-image

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SDK
        working-directory: sdks/python
        run: pip install -e '.[dev]'

      - name: Harness unit tests
        working-directory: sdks/python
        run: pytest perf/tests -q

      - uses: ./sdks/testing/actions/checkout-perf-results

      - name: Run pr profiles
        working-directory: sdks/python
        env:
          ARGS: ${{ inputs.sdk_args || '--suite pr' }}
        run: python -m perf --env-label ci-ubuntu-latest --out ../../perf-results $ARGS

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: perf-sdk-python
          path: perf-results/sdk-python
          if-no-files-found: ignore

  typescript:
    name: TypeScript SDK
    needs: [changes, unit, build-image]
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: ./sdks/testing/actions/load-api-image

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - name: Install SDK
        working-directory: sdks/typescript
        run: npm ci

      - name: Harness unit tests
        working-directory: sdks/typescript
        run: npm run perf:typecheck && npx vitest run perf

      - uses: ./sdks/testing/actions/checkout-perf-results

      - name: Run pr profiles
        working-directory: sdks/typescript
        env:
          ARGS: ${{ inputs.sdk_args || '--suite pr' }}
        run: npm run perf -- --env-label ci-ubuntu-latest --out ../../perf-results $ARGS

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: perf-sdk-typescript
          path: perf-results/sdk-typescript
          if-no-files-found: ignore

  java:
    name: Java SDK
    needs: [changes, unit, build-image]
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: ./sdks/testing/actions/load-api-image

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Harness unit tests
        working-directory: sdks/java
        run: mvn -B -q test -Dtest='com.daprmq.client.perf.*Test'

      - uses: ./sdks/testing/actions/checkout-perf-results

      - name: Run pr profiles
        working-directory: sdks/java
        env:
          ARGS: ${{ inputs.sdk_args || '--suite pr' }}
        run: mvn -B -q -Pperf test-compile exec:exec -Dperf.args="--env-label ci-ubuntu-latest --out ../../perf-results $ARGS"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: perf-sdk-java
          path: perf-results/sdk-java
          if-no-files-found: ignore

  # Merges every SDK job's results into perf-results, regenerates the cross-SDK report, and pushes
  # (not on PRs). Each SDK job only ever writes its own sdk-<sdk>/ directory.
  publish:
    name: Report and publish
    needs: [dotnet, python, typescript, java]
    if: ${{ !cancelled() && (contains(needs.*.result, 'success') || contains(needs.*.result, 'failure')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: ./sdks/testing/actions/publish-perf-results
        with:
          push: ${{ github.event_name != 'pull_request' }}
          message: 'Perf: ${{ github.sha }} (${{ github.event_name }})'
