name: Session drain performance

# End-to-end .NET SDK benchmark (sdks/dotnet/perf): the five `--suite ci` profiles against one
# Testcontainers stack, compared with the median of recent `main` runs (table in the job summary).
# Report-only for now: the job fails only on lost/reordered messages, not on a slower number.
# Add --gate to the run step once there's enough history to know each metric's noise.
#
# Results accumulate on the orphan `perf-results` branch under sdk-dotnet/. Pushes to main,
# nightly and manual runs append to it; PR runs only read it as their baseline.

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'sdks/dotnet/**'
      - '.github/workflows/sdk-perf.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'sdks/dotnet/**'
      - '.github/workflows/sdk-perf.yml'
  schedule:
    - cron: '0 4 * * *' # nightly, so main keeps a baseline even on quiet days
  workflow_dispatch:
    inputs:
      args:
        description: 'Benchmark flags, e.g. --suite ci | --profile full | --profile quick --idle-timeout 1'
        required: false
        default: '--suite ci'

permissions:
  contents: write

concurrency:
  # PR runs replace each other; runs that write results queue so pushes to perf-results never race.
  group: ${{ github.event_name == 'pull_request' && format('sdk-perf-{0}', github.ref) || 'sdk-perf-results' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  session-drain:
    name: .NET SDK session drain
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          tags: daprmq-api:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check out results branch
        run: |
          git fetch origin perf-results --depth=1 || true
          if git rev-parse --verify -q origin/perf-results > /dev/null; then
            git worktree add perf-results origin/perf-results
            git -C perf-results switch -C perf-results
          else
            git worktree add --orphan -b perf-results perf-results
          fi

      - name: Run benchmark
        env:
          ARGS: ${{ inputs.args || '--suite ci' }}
        # ARGS is deliberately unquoted so it splits into separate flags. The comparison table is
        # appended to the job summary by the benchmark itself (GITHUB_STEP_SUMMARY).
        run: >
          dotnet run -c Release --project sdks/dotnet/perf/DaprMQ.Client.Perf --
          --env-label ci-ubuntu-latest
          --out perf-results/sdk-dotnet
          $ARGS

      - name: Publish results
        if: always() && github.event_name != 'pull_request'
        working-directory: perf-results
        run: |
          [ -f sdk-dotnet/history.jsonl ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdk-dotnet
          git commit -m "Session drain perf: ${GITHUB_SHA::7} (${GITHUB_EVENT_NAME})" || exit 0
          git push origin perf-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-drain-perf
          path: perf-results/sdk-dotnet
          if-no-files-found: ignore
