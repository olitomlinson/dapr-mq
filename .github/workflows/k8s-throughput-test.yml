name: K8s throughput test (build)

# Keeps tools/k8s-throughput buildable between the manual extreme runs that use it
# (perf-extreme.yml's k8s-throughput job): its unit tests, the chart, run.sh and the image. No cluster
# is needed. It watches the SDK and both proto files as well, since the test compiles against them.

on:
  push:
    branches: [main]
    paths:
      - 'tools/k8s-throughput/**'
      - 'sdks/dotnet/src/**'
      - 'server/src/DaprMQ.ApiServer/Protos/**'
      - 'server/src/DaprMQ.Operator/Protos/**'
      - '.github/workflows/k8s-throughput-test.yml'
  pull_request:
    paths:
      - 'tools/k8s-throughput/**'
      - 'sdks/dotnet/src/**'
      - 'server/src/DaprMQ.ApiServer/Protos/**'
      - 'server/src/DaprMQ.Operator/Protos/**'
      - '.github/workflows/k8s-throughput-test.yml'

permissions:
  contents: read

concurrency:
  group: k8s-throughput-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests, chart and image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Unit tests
        run: dotnet test tools/k8s-throughput/ThroughputTest.Tests

      - uses: azure/setup-helm@v4
        with:
          version: v4.1.3

      - name: Chart
        run: |
          helm lint tools/k8s-throughput/chart --set-string runId=ci
          helm template t tools/k8s-throughput/chart --set-string runId=ci > /dev/null
          helm template t tools/k8s-throughput/chart --set-string runId=ci --set scaling.mode=fixed > /dev/null
          helm template t tools/k8s-throughput/chart --set-string runId=ci --set workload=sessions > /dev/null

      - name: run.sh
        run: |
          bash -n tools/k8s-throughput/run.sh
          tools/k8s-throughput/run.sh --help > /dev/null

      - uses: docker/setup-buildx-action@v3

      - name: Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/k8s-throughput/Dockerfile
          push: false
          tags: daprmq-throughput-test:ci
          cache-from: type=gha,scope=k8s-throughput-test
          cache-to: type=gha,mode=max,scope=k8s-throughput-test
