name: Console

# The admin console app (console/): unit tests against MSW fixtures, then a production build. The
# operator image build (and its HTTP contract tests) runs in the integration workflow.

on:
  push:
    branches: [main]
    paths:
      - 'console/**'
      - '.github/workflows/console.yml'
  pull_request:
    paths:
      - 'console/**'
      - '.github/workflows/console.yml'

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
