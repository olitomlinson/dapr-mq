name: Release

# Pushing a tag vX.Y.Z[-alpha.N|-rc.N] publishes every asset at that version (docs/RELEASING.md).
# npm, the Go module, the images and the Helm chart are wired up so far; the other registries follow.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag format
        id: v
        run: |
          tag='${{ github.ref_name }}'
          if [[ ! $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|rc)\.[0-9]+)?$ ]]; then
            echo "::error::$tag is not vX.Y.Z, vX.Y.Z-alpha.N or vX.Y.Z-rc.N"; exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          [[ $tag == *-* ]] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"

      # Releases ship what CI has already run against: the tagged commit must be on main.
      - name: Check tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::${{ github.ref_name }} is not on main"; exit 1; }

  npm:
    name: npm (@daprmq/client)
    needs: version
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # provenance, and trusted publishing once NPM_TOKEN is retired
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1

      - name: Install
        run: npm ci

      - name: Stamp version
        run: npm version '${{ needs.version.outputs.version }}' --no-git-tag-version --allow-same-version

      - name: Unit tests
        run: npm test

      # Pre-releases publish to `next`; full releases to `latest`. Until the first full release, pre-releases
      # are all there is, so `latest` follows them too and a plain `npm install @daprmq/client` gets the newest.
      - name: Choose dist-tags
        id: tag
        run: |
          # A failed lookup fails the job rather than risk moving `latest` to a pre-release.
          versions=$(npm view @daprmq/client versions --json)
          if [[ '${{ needs.version.outputs.prerelease }}' == 'false' ]]; then tag=latest; also_latest=false
          elif jq -e 'if type == "array" then . else [.] end | any(contains("-") | not)' <<< "$versions" >/dev/null; then tag=next; also_latest=false
          else tag=next; also_latest=true; fi
          echo "dist-tag: $tag, also latest: $also_latest"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "also_latest=$also_latest" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: npm publish --provenance --tag ${{ steps.tag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The trusted publisher is allowed to manage dist-tags.
      - name: Point latest at the pre-release
        if: steps.tag.outputs.also_latest == 'true'
        run: npm dist-tag add '@daprmq/client@${{ needs.version.outputs.version }}' latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  go:
    name: Go module (sdks/go)
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the sdks/go/vX.Y.Z tag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: sdks/go/go.mod
          cache-dependency-path: sdks/go/go.sum

      - name: Unit tests
        working-directory: sdks/go
        run: go test ./...

      # A Go module in a subdirectory is versioned by a <dir>/vX.Y.Z tag on the same commit. Tags pushed with
      # GITHUB_TOKEN don't trigger workflows, so this doesn't re-run the release.
      - name: Tag
        run: |
          tag="sdks/go/v${{ needs.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::notice::$tag already exists"; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "Go SDK v${{ needs.version.outputs.version }}" "$GITHUB_SHA"
          git push origin "$tag"

      # Fetching the version makes the module proxy cache it, so `go get` sees it straight away.
      - name: Warm the module proxy
        run: curl -sSf "https://proxy.golang.org/github.com/olitomlinson/dapr-mq/sdks/go/@v/v${{ needs.version.outputs.version }}.info"

  images:
    name: Image (${{ matrix.name }})
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    strategy:
      matrix:
        include:
          - name: daprmq
            context: server
            file: server/Dockerfile
          - name: daprmq-operator
            context: server
            file: server/Dockerfile.operator
          - name: daprmq-dashboard
            context: dashboard
            file: dashboard/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # The build stages run on the runner's platform (FROM --platform=$BUILDPLATFORM), so only the
      # runtime stages, which just COPY, target arm64: no QEMU needed.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pre-releases never move `latest` (docs/RELEASING.md).
      - name: Tags
        id: tags
        run: |
          image="ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}"
          tags="$image:${{ needs.version.outputs.version }}"
          [[ '${{ needs.version.outputs.prerelease }}' == 'false' ]] && tags+=",$image:latest"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=Elastic-2.0

  chart:
    name: Helm chart
    needs: [version, images] # never publish a chart whose images don't exist
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Package
        run: helm package helm --version '${{ needs.version.outputs.version }}' --app-version '${{ needs.version.outputs.version }}'

      - name: Push
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | helm registry login ghcr.io -u '${{ github.actor }}' --password-stdin
          helm push 'daprmq-${{ needs.version.outputs.version }}.tgz' 'oci://ghcr.io/${{ github.repository_owner }}/charts'
