name: Integration tests

on:
  # No `paths:` filter here on purpose: the `changes` job decides what runs, so PRs touching only
  # other folders still report the `gate` check (a required check would otherwise hang as
  # "expected"). Such PRs run just the lightweight detect + gate jobs.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # nightly full run (scheduled runs only fire from the default branch)

permissions:
  contents: read

concurrency:
  group: sdk-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides what to run from the changed paths:
  #   server/**                      -> build image, server integration tests, ALL SDK suites
  #   sdks/<sdk>/**                  -> build image (cached), only that SDK's suite
  #   sdks/testing/** or this file   -> everything (shared harness changed)
  #   workflow_dispatch / nightly    -> everything
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.decide.outputs.server }}
      dotnet: ${{ steps.decide.outputs.dotnet }}
      python: ${{ steps.decide.outputs.python }}
      image: ${{ steps.decide.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Pushes: diff against the previous commit (default would be main). PRs: default (PR base).
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: |
            server:
              - 'server/**'
            dotnet:
              - 'sdks/dotnet/**'
            python:
              - 'sdks/python/**'
            shared:
              - 'sdks/testing/**'
              - '.github/workflows/sdk-integration-tests.yml'

      - name: Decide
        id: decide
        run: |
          all=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "schedule" || "${{ steps.filter.outputs.shared }}" == "true" ]]; then
            all=true
          fi
          server=$all; dotnet=$all; python=$all
          [[ "${{ steps.filter.outputs.server }}" == "true" ]] && server=true && dotnet=true && python=true
          [[ "${{ steps.filter.outputs.dotnet }}" == "true" ]] && dotnet=true
          [[ "${{ steps.filter.outputs.python }}" == "true" ]] && python=true
          image=false
          [[ $server == true || $dotnet == true || $python == true ]] && image=true
          {
            echo "server=$server"
            echo "dotnet=$dotnet"
            echo "python=$python"
            echo "image=$image"
          } | tee -a "$GITHUB_OUTPUT"

  # Built whenever any suite runs. The gha layer cache makes this near-instant when server/ is
  # unchanged (SDK-only changes).
  build-image:
    name: Build daprmq-api image
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          tags: daprmq-api:test
          outputs: type=docker,dest=daprmq-api.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/upload-artifact@v4
        with:
          name: daprmq-api-image
          path: daprmq-api.tar
          retention-days: 1

  # Each suite starts its own stack via Testcontainers (see sdks/testing/INTEGRATION_TESTS.md);
  # the runner only needs Docker and the prebuilt daprmq-api:test image.
  server:
    name: Server integration tests
    needs: [changes, build-image]
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./sdks/testing/actions/load-api-image

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run integration tests
        env:
          # Shared runners are ~2x slower than a dev machine; loosen the bulk throughput ceiling (default 60s).
          DAPRMQ_BULK_TEST_MAX_SECONDS: '300'
        # QueryCountComparisonTest is a local experiment that needs two hand-built images
        # (daprmq-api:reentrancyfix / :refreshfix), so it can't run on a fresh runner.
        run: >
          dotnet test server/tests/DaprMQ.IntegrationTests/DaprMQ.IntegrationTests.csproj
          --configuration Release
          --filter "FullyQualifiedName!~QueryCountComparisonTest"

  dotnet:
    name: .NET SDK
    needs: [changes, build-image]
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./sdks/testing/actions/load-api-image

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run integration tests
        run: dotnet test sdks/dotnet/tests/DaprMQ.Client.IntegrationTests

  python:
    name: Python SDK
    needs: [changes, build-image]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./sdks/testing/actions/load-api-image

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SDK
        working-directory: sdks/python
        run: pip install -e '.[dev]'

      - name: Run integration tests
        working-directory: sdks/python
        run: pytest tests/integration -v

  # Single required check for branch protection: the jobs above are conditional, so requiring them
  # individually would block PRs where they're legitimately skipped. Skipped = fine; failed or
  # cancelled = fail.
  gate:
    name: Integration tests gate
    needs: [changes, build-image, server, dotnet, python]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed or was cancelled
        run: |
          echo '${{ toJSON(needs) }}'
          [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "false" ]]

  # TypeScript and Java have no integration tests yet - add a job here (checkout, then the
  # load-api-image action) plus a filter/output in `changes` when their Testcontainers fixtures land.
