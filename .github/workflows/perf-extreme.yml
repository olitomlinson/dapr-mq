name: Performance (extreme)

# The `extreme` scale of sdks/testing/PERFORMANCE_TESTS.md, run only by hand: concurrency ramps up
# to 256 workers and the big session drains, against a scaled-out Testcontainers stack (N API
# replicas behind nginx, 3-node scheduler HA). Each SDK runs in its own job on its own stack, then
# one job builds the cross-SDK report. Expect ~2h for the full suite on a standard runner.
#
# Results go to the perf-results branch (unless `publish` is off) under the runner's env label and
# API replica count, so they never mix with the pr-scale baselines.
#
# The k8s-throughput job is different: it deploys DaprMQ, Dapr, Postgres and KEDA onto a kind cluster
# on the runner and runs tools/k8s-throughput twice, for a queue and for sessions (KEDA-scaled competing
# or session consumers draining a backlog,
# once per replica count). Its records use the same schema, as P-05 queue drains with profiles
# k8s-queue-drain-r<N>, and publish alongside the SDK runs under sdk-dotnet-k8s.

on:
  workflow_dispatch:
    inputs:
      api_replicas:
        description: 'API server replicas behind the load balancer'
        required: false
        default: '3'
      profiles:
        description: 'Space-separated extreme profiles, or "all" (enqueue-ramp enqueue-hot-ramp enqueue-batch-ramp dequeue-ack-ramp full wide-drain queue-drain-large queue-drain-tail)'
        required: false
        default: 'all'
      runner:
        description: 'Runner label (a larger runner gives the stack and the load generator more headroom)'
        required: false
        default: 'ubuntu-latest'
      dotnet:
        description: 'Run the .NET SDK'
        type: boolean
        default: true
      python:
        description: 'Run the Python SDK'
        type: boolean
        default: true
      typescript:
        description: 'Run the TypeScript SDK'
        type: boolean
        default: true
      java:
        description: 'Run the Java SDK'
        type: boolean
        default: true
      k8s_throughput:
        description: 'Run the in-cluster throughput test (kind + KEDA)'
        type: boolean
        default: true
      k8s_replicas:
        description: 'Consumer replica counts for the throughput test, comma-separated, one run each'
        required: false
        default: '2,5,10,20'
      k8s_messages:
        description: 'Backlog per throughput run (queue and sessions; sessions spread it over 1,000 sessions)'
        required: false
        default: '100000'
      publish:
        description: 'Commit results to the perf-results branch'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  # One extreme run at a time. Publishing merges by runId and retries the push, so it can overlap
  # with the pr workflow safely.
  group: perf-extreme
  cancel-in-progress: false

# Testcontainers' reaper (ryuk) only lives on Docker Hub, whose anonymous pull limit the runners
# share; the test images themselves come from other registries (sdks/testing/INTEGRATION_TESTS.md).
# Runners are discarded after each job, so there's nothing for ryuk to clean up.
env:
  TESTCONTAINERS_RYUK_DISABLED: 'true'

jobs:
  build-image:
    name: Build daprmq-api image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          tags: daprmq-api:test
          outputs: type=docker,dest=daprmq-api.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v4
        with:
          name: daprmq-api-image
          path: daprmq-api.tar
          retention-days: 1

  dotnet:
    name: .NET SDK
    needs: build-image
    if: inputs.dotnet
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: ./sdks/testing/actions/load-api-image

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: ./sdks/testing/actions/checkout-perf-results

      - name: Run extreme profiles
        env:
          PROFILES: ${{ inputs.profiles }}
          REPLICAS: ${{ inputs.api_replicas }}
          ENV_LABEL: ci-${{ inputs.runner }}
        run: |
          common=(--env-label "$ENV_LABEL" --out perf-results --api-replicas "$REPLICAS")
          if [[ "$PROFILES" == "all" ]]; then
            dotnet run -c Release --project sdks/dotnet/perf/DaprMQ.Client.Perf -- --suite extreme "${common[@]}"
          else
            status=0
            for profile in $PROFILES; do
              dotnet run -c Release --project sdks/dotnet/perf/DaprMQ.Client.Perf -- --profile "$profile" "${common[@]}" || status=$?
            done
            exit $status
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: perf-sdk-dotnet
          path: perf-results/sdk-dotnet
          if-no-files-found: ignore

  python:
    name: Python SDK
    needs: build-image
    if: inputs.python
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: ./sdks/testing/actions/load-api-image

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SDK
        working-directory: sdks/python
        run: pip install -e '.[dev]'

      - uses: ./sdks/testing/actions/checkout-perf-results

      - name: Run extreme profiles
        working-directory: sdks/python
        env:
          PROFILES: ${{ inputs.profiles }}
          REPLICAS: ${{ inputs.api_replicas }}
          ENV_LABEL: ci-${{ inputs.runner }}
        run: |
          perf() { python -m perf $1; }
          common="--env-label $ENV_LABEL --out ../../perf-results --api-replicas $REPLICAS"
          if [[ "$PROFILES" == "all" ]]; then
            perf "--suite extreme $common"
          else
            status=0
            for profile in $PROFILES; do
              perf "--profile $profile $common" || status=$?
            done
            exit $status
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: perf-sdk-python
          path: perf-results/sdk-python
          if-no-files-found: ignore

  typescript:
    name: TypeScript SDK
    needs: build-image
    if: inputs.typescript
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: ./sdks/testing/actions/load-api-image

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - name: Install SDK
        working-directory: sdks/typescript
        run: npm ci

      - uses: ./sdks/testing/actions/checkout-perf-results

      - name: Run extreme profiles
        working-directory: sdks/typescript
        env:
          PROFILES: ${{ inputs.profiles }}
          REPLICAS: ${{ inputs.api_replicas }}
          ENV_LABEL: ci-${{ inputs.runner }}
        run: |
          perf() { npm run perf -- $1; }
          common="--env-label $ENV_LABEL --out ../../perf-results --api-replicas $REPLICAS"
          if [[ "$PROFILES" == "all" ]]; then
            perf "--suite extreme $common"
          else
            status=0
            for profile in $PROFILES; do
              perf "--profile $profile $common" || status=$?
            done
            exit $status
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: perf-sdk-typescript
          path: perf-results/sdk-typescript
          if-no-files-found: ignore

  java:
    name: Java SDK
    needs: build-image
    if: inputs.java
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: ./sdks/testing/actions/load-api-image

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: ./sdks/testing/actions/checkout-perf-results

      - name: Run extreme profiles
        working-directory: sdks/java
        env:
          PROFILES: ${{ inputs.profiles }}
          REPLICAS: ${{ inputs.api_replicas }}
          ENV_LABEL: ci-${{ inputs.runner }}
        run: |
          perf() { mvn -B -q -Pperf test-compile exec:exec -Dperf.args="$1"; }
          common="--env-label $ENV_LABEL --out ../../perf-results --api-replicas $REPLICAS"
          if [[ "$PROFILES" == "all" ]]; then
            perf "--suite extreme $common"
          else
            status=0
            for profile in $PROFILES; do
              perf "--profile $profile $common" || status=$?
            done
            exit $status
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: perf-sdk-java
          path: perf-results/sdk-java
          if-no-files-found: ignore

  k8s-throughput:
    name: Kubernetes throughput (KEDA)
    if: inputs.k8s_throughput
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than whatever the runner image ships, as in k8s-keda.yml.
      - uses: azure/setup-helm@v4
        with:
          version: v4.1.3

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: daprmq

      - name: Deploy Dapr, Postgres, KEDA and DaprMQ
        run: |
          ./k8s-base-deploy.sh --context kind-daprmq
          ./daprmq-deploy.sh --context kind-daprmq --skip-examples

      - name: Throughput runs
        env:
          REPLICAS: ${{ inputs.k8s_replicas }}
          MESSAGES: ${{ inputs.k8s_messages }}
          ENV_LABEL: ci-k8s-${{ inputs.runner }}
        run: |
          set -o pipefail
          status=0
          tools/k8s-throughput/run.sh --context kind-daprmq --replicas "$REPLICAS" --messages "$MESSAGES" \
            --env-label "$ENV_LABEL" --out perf-results | tee throughput.log || status=$?
          # Written whatever happened: a failed check is when the table matters most.
          {
            echo '## Kubernetes throughput'
            echo '```'
            sed -n '/== results/,$p' throughput.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # After the queue series whatever its result, on the same cluster: the same backlog over 1,000
      # sessions of 100, drained by session consumers (k8s-session-drain-r<N>).
      - name: Session throughput runs
        if: ${{ !cancelled() }}
        env:
          REPLICAS: ${{ inputs.k8s_replicas }}
          MESSAGES: ${{ inputs.k8s_messages }}
          ENV_LABEL: ci-k8s-${{ inputs.runner }}
        run: |
          set -o pipefail
          status=0
          tools/k8s-throughput/run.sh --context kind-daprmq --workload sessions --replicas "$REPLICAS" \
            --messages "$MESSAGES" --env-label "$ENV_LABEL" --out perf-results | tee session-throughput.log || status=$?
          {
            echo '## Kubernetes session throughput'
            echo '```'
            sed -n '/== results/,$p' session-throughput.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: perf-sdk-dotnet-k8s
          path: perf-results/sdk-dotnet-k8s
          if-no-files-found: ignore

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl get scaledobjects,jobs -A
          kubectl logs -n daprmq-throughput -l app.kubernetes.io/component=run --tail=200 || true
          kubectl logs -n daprmq -l app.kubernetes.io/component=operator -c daprmq --tail=200 --prefix || true

  publish:
    name: Report and publish
    needs: [dotnet, python, typescript, java, k8s-throughput]
    if: ${{ !cancelled() && (contains(needs.*.result, 'success') || contains(needs.*.result, 'failure')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: ./sdks/testing/actions/publish-perf-results
        with:
          push: ${{ inputs.publish }}
          message: 'Perf extreme: ${{ github.sha }} (${{ inputs.api_replicas }} replicas)'
