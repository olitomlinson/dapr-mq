# Local Prometheus for docker compose: scrapes DaprMQ's /metrics (DaprMQ.Queue, DaprMQ.Topic,
# DaprMQ.Delivery) on the gateway and every worker. The operator's admin console queries it.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: daprmq-worker
    static_configs:
      - targets: ['worker-1:8080', 'worker-2:8080', 'worker-3:8080']
  - job_name: daprmq-gateway
    static_configs:
      - targets: ['gateway-1:8080']
