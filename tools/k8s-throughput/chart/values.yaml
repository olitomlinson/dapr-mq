# One throughput run. run.sh sets runId and anything passed on its command line.

# Required. Names the queue (tp-<runId>) and the Job, so every run starts on an empty queue and a new Job.
runId: ""

# queue: competing consumers (QueueConsumer) drain one queue.
# sessions: session consumers (SessionQueueConsumer) drain the backlog spread over `sessions.count` sessions.
workload: queue

image:
  repository: daprmq-throughput-test
  tag: dev
  pullPolicy: IfNotPresent

# The DaprMQ release under test.
daprmq:
  namespace: daprmq
  gatewayService: daprmq-gateway
  httpPort: 8080
  grpcPort: 8081
  # The operator's KEDA external scaler: KEDA scales the consumers from it, and the Job reads depth from it.
  operatorService: daprmq-operator
  operatorGrpcPort: 8081

# The Job: publishes the backlog, waits for it to drain, prints "RESULT {json}".
run:
  messages: 100000
  publishers: 10
  publishBatch: 100
  timeoutSeconds: 1800
  # For the result record (sdks/testing/perf/result.schema.json); run.sh fills these in.
  envLabel: local
  gatewayReplicas: 1
  serverLabel: kubernetes
  gitSha: ""
  gitBranch: ""
  gitDirty: "false"

# The competing consumers (QueueConsumer).
consumer:
  handlers: 10
  window: 40
  itemDelayMs: 200
  lockTtlSeconds: 60
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# The session consumers (SessionQueueConsumer), for workload: sessions. consumer.itemDelayMs and
# consumer.resources apply to them too; handlers, window and lockTtlSeconds don't.
sessions:
  # run.messages is spread evenly over them, so it must divide it.
  count: 1000
  # MaxConcurrentSessions per consumer. KEDA aims for this many sessions with work per replica.
  concurrent: 10
  prefetch: 1
  leaseSeconds: 30
  # Not the server default (the lease), which would hold every drained session for 30s.
  idleTimeoutSeconds: 1
  # Each session's length drawn within this percentage of the mean (0-90; the total stays run.messages).
  lengthJitterPercent: 0
  # Each session published at a random time in the first this-many seconds (0: all at once).
  publishJitterSeconds: 0

scaling:
  # keda: a ScaledObject scales the consumers 0..maxReplicas from queue depth, as in production.
  # fixed: exactly `replicas` consumers, for a comparison without autoscaling in the way.
  mode: keda
  maxReplicas: 20
  replicas: 20
  # Ready + locked messages per replica (queue). For sessions, sessions.concurrent is used instead.
  targetValue: 50
  # keda: let the HPA go straight to maxReplicas rather than its default +100% (or +4 pods) per 15s,
  # so a run isn't mostly measuring the ramp. Recorded in the result's key as +fastscale.
  fastScaleUp: false
  pollingInterval: 5
  cooldownPeriod: 30
