{{- if and .Values.console.enabled .Values.console.ingress.enabled }}
# The console has no auth of its own: authenticate at this ingress (docs/CONSOLE.md).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "daprmq.fullname" . }}-console
  labels:
    {{- include "daprmq.labels" . | nindent 4 }}
  {{- with .Values.console.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.console.ingress.className }}
  ingressClassName: {{ .Values.console.ingress.className }}
  {{- end }}
  {{- if .Values.console.ingress.tls }}
  tls:
    {{- range .Values.console.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.console.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "daprmq.fullname" $ }}-operator-console
                port:
                  number: {{ $.Values.operator.httpPort }}
          {{- end }}
    {{- end }}
{{- end }}
