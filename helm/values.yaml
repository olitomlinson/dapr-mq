# Default values for DaprMQ Helm chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global image configuration
image:
  registry: ghcr.io/olitomlinson      # "" = local images (e.g. kind/docker-desktop)
  repository: daprmq
  tag: ""                           # "" = chart appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Dapr configuration
dapr:
  # Dapr app protocol: "http" or "grpc"
  # NOTE: This setting only affects the GATEWAY nodes.
  # Worker nodes always use HTTP (required for actor registration).
  protocol: "http"

  # Dapr sidecar log level
  logLevel: "info"

  # REQUIRED: Name of the Dapr state store Component CR deployed in your namespace
  # Multiple installations can share the same state store (actor isolation by app-id)
  # No default value - must be explicitly set during installation
  stateStoreName: ""

  # The install fails unless stateStoreName is an actor state store Component
  # (actorStateStore: "true") in the release namespace. Set true to skip the check,
  # e.g. when the Component is applied after the chart or the installer can't read Components.
  skipStateStoreCheck: false

# Worker configuration (REGISTER_ACTORS=true)
worker:
  enabled: true
  replicaCount: 2

  # Container port (8080 for HTTP, 8081 for gRPC)
  # This is automatically set based on dapr.protocol
  httpPort: 8080
  grpcPort: 8081

  # Resource limits and requests
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Liveness probe configuration
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3

  # Readiness probe configuration
  readinessProbe:
    httpGet:
      path: /health/ready
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3

  # Pod annotations (in addition to Dapr annotations)
  podAnnotations: {}

  # Pod security context
  podSecurityContext: {}
    # fsGroup: 2000

  # Container security context
  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Affinity rules
  affinity: {}

# Gateway configuration (REGISTER_ACTORS=false)
gateway:
  enabled: true
  replicaCount: 3

  # Container port (8080 for HTTP, 8081 for gRPC)
  # This is automatically set based on dapr.protocol
  httpPort: 8080
  grpcPort: 8081

  # Resource limits and requests
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Liveness probe configuration
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3

  # Readiness probe configuration
  readinessProbe:
    httpGet:
      path: /health/ready
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3

  # Pod annotations (in addition to Dapr annotations)
  podAnnotations: {}

  # Pod security context
  podSecurityContext: {}

  # Container security context
  securityContext: {}

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Affinity rules
  affinity: {}

# Object store configuration for large object / binary offload support.
# Deploy a Dapr Binary Store Component (binarystore.azure.blobstorage, binarystore.aws.s3, ...) named to
# match blobStore.storeName - see server/dapr/helm-components/blobstore-k8s.yaml. A deployment-wide
# key prefix is set with the component's own `prefix` metadata.
blobStore:
  # Name of the Dapr Binary Store Component used for object storage.
  storeName: "daprmq-blobstore"

  # Largest object accepted by POST /queue/{id}/enqueue-object, in bytes. Bodies stream to the store,
  # so this is not bounded by the sidecar's max body size.
  maxObjectBytes: 104857600

  # HMAC signing key for ObjectClaimTokens (opaque tokens issued in place of raw blob references
  # when large-object items are dequeued). Must be set explicitly for any non-dev deployment - the
  # application falls back to an insecure dev-only default if left empty.
  signingKey: ""

  # Reap schedule for offloaded blobs (two TTLs - see docs/API_REFERENCE.md):
  # - backstopSeconds: scheduled at item finalization (plain dequeue, or acknowledge for dequeue-locked).
  #   Covers the case where the issued ObjectClaimToken is never redeemed.
  # - postDownloadSeconds: scheduled when the object is actually fetched via the claim-token
  #   download endpoint. Only pushes the deletion time later, never earlier.
  reap:
    backstopSeconds: 86400
    postDownloadSeconds: 86400

# DaprMQ.Operator - control-plane service. v1 hosts the KEDA external scaler that scales *consumer*
# workloads on queue depth (KEDA must be installed separately). Point a ScaledObject trigger at it:
#   triggers:
#   - type: external-push            # or "external" for polling only
#     metadata:
#       scalerAddress: <fullname>-operator.<namespace>:8081
#       queueId: orders
#       targetValue: "10"            # items (or sessions) per consumer replica
# See docs/ARCHITECTURE.md ("Autoscaling consumers with KEDA") for every trigger field.
operator:
  enabled: false
  replicaCount: 2

  image:
    registry: ""                     # "" = image.registry
    repository: daprmq-operator
    tag: ""                          # "" = image.tag

  httpPort: 8080                     # health
  grpcPort: 8081                     # KEDA scalerAddress

  # Depth reads are cached this long so KEDA's several calls per poll cost one worker read.
  depthCacheTtlMs: 1000
  # How often an external-push stream re-checks activation (scale from zero latency).
  streamPollIntervalMs: 1000

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5

  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Read-only admin console, served by the operator on its HTTP port (requires operator.enabled).
# No auth in v1: anyone who can reach the console Service can read message payloads and lock ids,
# so it is ClusterIP only. Reach it with
#   kubectl port-forward svc/<fullname>-operator-console 9100:8080
# or put your own authenticating ingress in front. See docs/CONSOLE.md.
console:
  enabled: false
  # List and detail reads are cached this long, shared by every user.
  cacheTtlMs: 10000
  # Worker calls the console may have in flight at once (per operator pod).
  maxWorkerCalls: 8
  # Run the console as its own Deployment of the operator image (scaler off there), so console
  # load can never delay KEDA's GetMetrics. Off = the operator pods serve it.
  separateDeployment: false
  # The Scaling page charts KEDA ScaledObjects that use the DaprMQ scaler. The console samples
  # them in memory (per pod, lost on restart).
  scaling:
    sampleIntervalSeconds: 15
    historyMinutes: 60
  # Give the console's pods a service account with cluster-wide read access to KEDA ScaledObjects,
  # ScaledJobs, HPAs and Jobs, so the Scaling page shows current/desired replicas, min/max and
  # ScaledObject health. Off = no ClusterRole, and it shows only what each queue's metric asks for,
  # ceil(metric / target).
  kubernetesRead: true
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  # Optional ingress to the console Service. It has no auth of its own: put authentication in
  # front (e.g. oauth2-proxy annotations for your ingress controller).
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: daprmq-console.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

# Autoscaling configuration (for worker)
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  # targetMemoryUtilizationPercentage: 80

# Dashboard configuration (React + Nginx)
dashboard:
  enabled: false  # Opt-in feature
  replicaCount: 2

  image:
    registry: ""                     # "" = image.registry
    repository: daprmq-dashboard
    tag: ""                         # "" = chart appVersion
    pullPolicy: IfNotPresent

  # Gateway connection settings
  # Service name to connect to
  gatewayServiceName: "{{ include \"daprmq.fullname\" . }}-gateway"
  gatewayPort: 8080

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: false
    className: "nginx"
    annotations: {}
      # cert-manager.io/cluster-issuer: letsencrypt-prod
      # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: daprmq-dashboard.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
      # - secretName: daprmq-dashboard-tls
      #   hosts:
      #     - daprmq-dashboard.local

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  livenessProbe:
    httpGet:
      path: /health
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3

  nodeSelector: {}
  tolerations: []
  affinity: {}
