# Default values for DaprMQ Helm chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global image configuration
image:
  registry: ""
  repository: daprmq
  tag: "0.1.3"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Dapr configuration
dapr:
  # Dapr app protocol: "http" or "grpc"
  # NOTE: This setting only affects the GATEWAY nodes.
  # Worker nodes always use HTTP (required for actor registration).
  protocol: "http"

  # Dapr sidecar log level
  logLevel: "info"

  # REQUIRED: Name of the Dapr state store Component CR deployed in your namespace
  # Multiple installations can share the same state store (actor isolation by app-id)
  # No default value - must be explicitly set during installation
  stateStoreName: ""

# Worker configuration (REGISTER_ACTORS=true)
worker:
  enabled: true
  replicaCount: 2

  # Container port (8080 for HTTP, 8081 for gRPC)
  # This is automatically set based on dapr.protocol
  httpPort: 8080
  grpcPort: 8081

  # Resource limits and requests
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Liveness probe configuration
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3

  # Readiness probe configuration
  readinessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3

  # Pod annotations (in addition to Dapr annotations)
  podAnnotations: {}

  # Pod security context
  podSecurityContext: {}
    # fsGroup: 2000

  # Container security context
  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Affinity rules
  affinity: {}

# Gateway configuration (REGISTER_ACTORS=false)
gateway:
  enabled: true

  # Container port (8080 for HTTP, 8081 for gRPC)
  # This is automatically set based on dapr.protocol
  httpPort: 8080
  grpcPort: 8081

  # Resource limits and requests
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Liveness probe configuration
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3

  # Readiness probe configuration
  readinessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3

  # Pod annotations (in addition to Dapr annotations)
  podAnnotations: {}

  # Pod security context
  podSecurityContext: {}

  # Container security context
  securityContext: {}

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Affinity rules
  affinity: {}

# Object store configuration for large object / binary offload support.
# See dapr/helm-components/objectstore-k8s.yaml for the Component CR - deploy the appropriate
# binding type for your environment (bindings.localstorage for single-node/dev, bindings.aws.s3
# or bindings.azure.blobstorage for production) and name it to match blobStore.bindingName.
blobStore:
  # Operator-controlled prefix applied to every blob key (e.g. "prod", "team-a"). Never
  # accepted from a request - callers only control the path segment beneath this.
  globalPrefix: ""

  # Name of the Dapr binding Component CR used for object storage.
  bindingName: "daprmq-blobstore"

  # bindings.localstorage requires every pod's Dapr sidecar to see the SAME directory, since the
  # binding operates on local disk. This only works with a ReadWriteMany-capable volume (e.g. NFS,
  # EFS, Azure Files) shared across gateway and worker pods - it does NOT work with a regular
  # ReadWriteOnce PVC once you have more than one node. For production, prefer bindings.aws.s3 or
  # bindings.azure.blobstorage instead (set localStorage.enabled: false) which need no shared volume.
  localStorage:
    enabled: false
    claimName: "daprmq-blobstore-pvc"

  # HMAC signing key for ObjectClaimTokens (opaque tokens issued in place of raw blob references
  # when large-object items are popped). Must be set explicitly for any non-dev deployment - the
  # application falls back to an insecure dev-only default if left empty.
  signingKey: ""

  # Reap schedule for offloaded blobs (two TTLs - see docs/API_REFERENCE.md):
  # - backstopSeconds: scheduled at item finalization (plain pop, or acknowledge for pop-with-ack).
  #   Covers the case where the issued ObjectClaimToken is never redeemed.
  # - postDownloadSeconds: scheduled when the object is actually fetched via the claim-token
  #   download endpoint. Only pushes the deletion time later, never earlier.
  reap:
    backstopSeconds: 86400
    postDownloadSeconds: 86400

# Autoscaling configuration (for worker)
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  # targetMemoryUtilizationPercentage: 80

# Dashboard configuration (React + Nginx)
dashboard:
  enabled: false  # Opt-in feature
  replicaCount: 2

  image:
    repository: daprmq-dashboard
    tag: "1.0.0"
    pullPolicy: IfNotPresent

  # Gateway connection settings
  # Service name to connect to (uses internalTrafficPolicy: Local for node-local routing)
  gatewayServiceName: "{{ include \"daprmq.fullname\" . }}-gateway"
  gatewayPort: 8080

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: false
    className: "nginx"
    annotations: {}
      # cert-manager.io/cluster-issuer: letsencrypt-prod
      # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: daprmq-dashboard.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
      # - secretName: daprmq-dashboard-tls
      #   hosts:
      #     - daprmq-dashboard.local

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  livenessProbe:
    httpGet:
      path: /health
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3

  nodeSelector: {}
  tolerations: []
  affinity: {}
