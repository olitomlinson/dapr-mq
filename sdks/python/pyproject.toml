[project]
name = "daprmq-client"
version = "0.0.0a0"
description = "Python client SDK for DaprMQ"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "grpcio>=1.66",
    "grpcio-health-checking>=1.66",
    "protobuf>=5.27",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.66",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "testcontainers>=4.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daprmq_client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
